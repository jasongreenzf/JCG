# Fly.io configuration — https://fly.io/docs
# Deploy with: fly launch (first time) or fly deploy (updates)

app = "jcg-hunt-tracker"
primary_region = "ord"       # Chicago — change to nearest: dfw, atl, sea, lax, etc.

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # DB_PATH is set via volume mount below

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Persistent volume for SQLite database
[[mounts]]
  source = "jcg_data"
  destination = "/data"
